```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BookLoop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bookloop-page">

    <!-- Navigation -->
    <nav class="bookloop-nav">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <a href="index.html"
               class="text-decoration-none d-flex align-items-center gap-2">
                <span class="brand-symbol">B</span>
                <span class="fw-bold fs-4 text-dark">BookLoop</span>
            </a>

            <a href="index.html"
               class="text-decoration-none text-dark fw-semibold">
                Browse Books
            </a>
        </div>
    </nav>

    <!-- Login Section -->
    <main class="container py-5">

        <div class="row justify-content-center align-items-center"
             style="min-height: 65vh;">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <section class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-4">

                            <div class="brand-symbol mx-auto mb-3"
                                 style="width: 58px; height: 58px; font-size: 1.5rem;">
                                B
                            </div>

                            <p class="hero-eyebrow mb-2">
                                WELCOME BACK
                            </p>

                            <h1 class="h2 fw-bold mb-2">
                                Login to BookLoop
                            </h1>

                            <p class="text-secondary mb-0">
                                Your next great read is just around the corner.
                            </p>
                        </div>

                        <!-- Login Form -->
                        <form id="login-form">

                            <div class="mb-3">
                                <label for="login-email" class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="login-email"
                                    placeholder="you@example.com"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="login-password"
                                       class="form-label fw-semibold">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="login-password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="search-submit w-100"
                            >
                                Login to Your Account
                            </button>

                        </form>

                        <!-- Register Link -->
                        <div class="text-center mt-4">
                            <p class="text-secondary mb-0">
                                Don't have an account?
                                <a href="register.html"
                                   class="fw-semibold text-success text-decoration-none">
                                    Register here
                                </a>
                            </p>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="index.html"
                               class="text-decoration-none text-secondary small">
                                &#8592; Back to Browse Books
                            </a>
                        </div>

                    </div>
                </section>

                <!-- Supporting Text -->
                <p class="text-center text-secondary small mt-4">
                    Read. Share. Repeat.
                </p>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bookloop-footer">
        <div class="container footer-inner py-4">
            <a href="index.html"
               class="footer-brand text-decoration-none">
                BookLoop
            </a>

            <p class="small mb-0">
                Connecting readers, one book at a time.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>

</body>
</html>
