<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bookloop-page">

    <nav class="bookloop-nav">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2">
                <span class="brand-symbol">B</span>
                <span class="fw-bold fs-4 text-dark">BookLoop</span>
            </a>
            <a href="index.html" class="text-decoration-none text-dark fw-semibold">Browse Books</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center align-items-center" style="min-height: 65vh;">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <section class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <div class="brand-symbol mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.5rem;">B</div>
                            <p class="hero-eyebrow mb-2">WELCOME BACK</p>
                            <h1 class="h2 fw-bold mb-2">Login to BookLoop</h1>
                            <p class="text-secondary mb-0">Your next great read is just around the corner.</p>
                        </div>

                        <!-- Feedback banner -->
                        <div id="login-alert" class="alert d-none py-2 small" role="alert"></div>

                        <!-- onsubmit explicitly calls handleLogin and prevents page reload -->
                        <form id="login-form" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label for="login-email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="login-email" placeholder="alice@example.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="login-password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                            </div>

                            <button type="submit" id="login-btn" class="search-submit w-100">
                                Login to Your Account
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-secondary mb-0">
                                Don't have an account?
                                <a href="register.html" class="fw-semibold text-success text-decoration-none">Register here</a>
                            </p>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="index.html" class="text-decoration-none text-secondary small">← Back to Browse Books</a>
                        </div>

                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
    async function handleLogin(event) {
        // Stop default browser form reload
        event.preventDefault();

        const alertBox = document.getElementById("login-alert");
        const submitBtn = document.getElementById("login-btn");
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        alertBox.className = "alert alert-info py-2 small";
        alertBox.textContent = "Connecting to server...";
        alertBox.classList.remove("d-none");
        submitBtn.disabled = true;

        try {
            const res = await fetch("../api/auth.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "login", email: email, password: password })
            });

            const data = await res.json();

            if (res.ok && data.status === "success") {
                alertBox.className = "alert alert-success py-2 small";
                alertBox.textContent = "Login successful! Redirecting to Dashboard...";
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);
            } else {
                alertBox.className = "alert alert-danger py-2 small";
                alertBox.textContent = data.message || "Invalid email or password.";
                submitBtn.disabled = false;
            }
        } catch (err) {
            console.error("Login fetch error:", err);
            alertBox.className = "alert alert-danger py-2 small";
            alertBox.textContent = "Connection error: " + err.message;
            submitBtn.disabled = false;
        }
    }
    </script>
</body>
</html>
