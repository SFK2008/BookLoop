<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLoop - Exchange Books & Share Digital Notes</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">BookLoop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Browse</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-2" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Header -->
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Exchange Books. Share Knowledge.</h1>
            <p class="lead">Swap physical books locally and access free community-contributed digital study notes.</p>
        </div>
    </header>

    <!-- Main Content: Advanced Search & Listings -->
    <main class="container my-5">
        
        <!-- Advanced Search & Filter Bar (MVP Essential) -->
        <div class="card p-4 mb-4 shadow-sm">
            <h5 class="card-title mb-3">Advanced Search & Filters</h5>
            <form id="search-filter-form" class="row g-3">
                <div class="col-md-4">
                    <label for="search-keyword" class="form-label">Title or Author</label>
                    <input type="text" id="search-keyword" class="form-control" placeholder="Search by title or author...">
                </div>
                <div class="col-md-3">
                    <label for="filter-genre" class="form-label">Genre</label>
                    <select id="filter-genre" class="form-select">
                        <option value="all">All Genres</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Science">Science</option>
                        <option value="Technology">Technology</option>
                        <option value="History">History</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filter-condition" class="form-label">Condition</label>
                    <select id="filter-condition" class="form-select">
                        <option value="all">Any Condition</option>
                        <option value="New">New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="reset" id="reset-filter-btn" class="btn btn-outline-secondary w-100">Reset</button>
                </div>
            </form>
        </div>

        <!-- Dynamic Content Grid -->
        <div id="listings-container" class="row g-4">
            <!-- Rendered dynamically by app.js -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 BookLoop Platform. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle & Custom Application Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
